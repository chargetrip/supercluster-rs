name: test

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.rs'
      - 'src/**.rs'
      - 'tests/**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'rust-toolchain.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.rs'
      - 'src/**.rs'
      - 'tests/**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'rust-toolchain.toml'
      - '.github/workflows/test.yml'

env:
  CI: true
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.96.0
        components: clippy, rustfmt
    - name: Install tarpaulin
      run: cargo install --locked cargo-tarpaulin
    - name: Run build
      run: cargo build --locked
    - name: Run clippy
      run: cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings
    - name: Run lint
      run: cargo fmt -- --check
    - name: Check feature combinations
      run: |
        for features in geojson serde tracing "geojson serde tracing"; do
          cargo check --locked --all-targets --no-default-features --features "$features"
        done
    - name: Run tests without features
      run: cargo test --locked
    - name: Run tests with all features, including doc tests
      run: cargo test --locked --all-features
    - name: Check docs
      run: cargo doc --locked --no-deps --all-features
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Run coverage
      # The benchmarks are left out, because tests cannot run them
      run: cargo tarpaulin --tests --bins --all-targets --all-features --locked --exclude-files "benches/*" --out xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v6
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        file: ./cobertura.xml
